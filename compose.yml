name: distributed-wagering-processor

services:
  app:
    build:
      context: .
      target: runtime
    init: true
    environment: &application-environment
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: wagering
      DATABASE_USER: wagering
      DATABASE_PASSWORD: wagering
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WAGER_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-transactions.fifo
      WAGER_DLQ_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-transactions-dlq.fifo
      SQS_WAIT_TIME_SECONDS: 20
      SQS_VISIBILITY_TIMEOUT: 30
      SQS_CONSUMER_ENABLED: "true"
      SQS_CONSUMER_NAME: wager-transactions-v1
      SQS_MAX_MESSAGES_PER_POLL: 10
      SQS_RETRY_BASE_SECONDS: 5
      SQS_RETRY_MAX_SECONDS: 300
      SQS_MAX_RECEIVE_ATTEMPTS: 5
      SQS_SHUTDOWN_GRACE_MS: 10000
      INTEGRATION_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:wager-integration-events
      REFERENCE_RETRY_BASE_MS: 1000
      REFERENCE_RETRY_MAX_MS: 60000
      REFERENCE_TTL_MS: 86400000
      OUTBOX_BATCH_SIZE: 100
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_PUBLISHER_ENABLED: "true"
      OUTBOX_RETRY_BASE_MS: 1000
      OUTBOX_RETRY_MAX_MS: 60000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const response = await fetch('http://127.0.0.1:3000/health/ready'); if (!response.ok) throw new Error('not ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    environment: *application-environment
    command: ["bun", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  localstack:
    build:
      context: ./docker/localstack
    image: distributed-wagering-localstack:4.14.0
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
      PERSISTENCE: 1
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null && awslocal sqs get-queue-url --queue-name wager-integration-events-audit >/dev/null && awslocal sns list-subscriptions | grep -q wager-integration-events",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  localstack-data:
