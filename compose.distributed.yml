x-app: &app
  image: ${COMPOSE_PROJECT_NAME}-app
  build:
    context: .
    target: runtime
  init: true
  environment: &env
    NODE_ENV: production
    PORT: 3000
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_NAME: wagering
    DATABASE_USER: wagering
    DATABASE_PASSWORD: wagering
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    WAGER_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-transactions.fifo
    WAGER_DLQ_URL: http://localstack:4566/queue/us-east-1/000000000000/wager-transactions-dlq.fifo
    INTEGRATION_EVENTS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:wager-integration-events
    SQS_CONSUMER_ENABLED: "true"
    SQS_CONSUMER_NAME: wager-transactions-v1
    SQS_WAIT_TIME_SECONDS: 1
    SQS_VISIBILITY_TIMEOUT: 6
    SQS_RETRY_BASE_SECONDS: 2
    SQS_RETRY_MAX_SECONDS: 10
    SQS_MAX_RECEIVE_ATTEMPTS: 5
    SQS_SHUTDOWN_GRACE_MS: 5000
    OUTBOX_PUBLISHER_ENABLED: "true"
    OUTBOX_BATCH_SIZE: 100
    OUTBOX_POLL_INTERVAL_MS: 200
    OUTBOX_RETRY_BASE_MS: 500
    OUTBOX_RETRY_MAX_MS: 2000
    REFERENCE_RETRY_BASE_MS: 500
    REFERENCE_RETRY_MAX_MS: 2000
    REFERENCE_TTL_MS: 86400000
  ports: ["127.0.0.1::3000"]
  depends_on:
    migrate: { condition: service_completed_successfully }
    localstack: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health/ready'); if (!r.ok) process.exit(1)"]
    interval: 2s
    timeout: 5s
    retries: 30
  stop_grace_period: 15s

services:
  app-a: *app
  app-b: *app
  app-c: *app
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-app
    environment: *env
    command: ["bun", "dist/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }
  fixture:
    profiles: ["fixtures"]
    image: ${COMPOSE_PROJECT_NAME}-fixture
    build:
      context: .
      target: test-runtime
    environment: *env
    init: true
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: wagering
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
    ports: ["127.0.0.1:${POSTGRES_PUBLISHED_PORT:-0}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30
  localstack:
    image: ${COMPOSE_PROJECT_NAME}-localstack
    build:
      context: ./docker/localstack
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
      PERSISTENCE: 1
    ports: ["127.0.0.1::4566"]
    volumes: ["localstack-data:/var/lib/localstack"]
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-transactions.fifo >/dev/null && awslocal sqs get-queue-url --queue-name wager-integration-events-audit >/dev/null && awslocal sns list-subscriptions | grep -q wager-integration-events"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

volumes:
  postgres-data:
  localstack-data:
